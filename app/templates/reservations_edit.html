{% extends "base.html" %}
{% block title %}Reservering wijzigen{% endblock %}
{% block content %}
<h1>Reservering wijzigen</h1>
{% if fout %}<p class="foutmelding">{{ fout }}</p>{% endif %}
<form method="post" action="/reservations/{{ reservering.id }}/edit">
    <label for="begintijd">Begintijd</label>
    <input type="datetime-local" name="begintijd" id="begintijd" value="{{ reservering.begintijd }}" required>
    <label for="eindtijd">Eindtijd</label>
    <input type="datetime-local" name="eindtijd" id="eindtijd" value="{{ reservering.eindtijd }}" required>
    <button type="submit">Opslaan</button>
</form>
{% endblock %}
