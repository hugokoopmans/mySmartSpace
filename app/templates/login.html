{% extends "base.html" %}
{% block title %}Inloggen - SmartSpace{% endblock %}
{% block content %}
<h1>Inloggen</h1>
{% if fout %}<p class="foutmelding">{{ fout }}</p>{% endif %}
<form method="post" action="/login">
    <label for="demo_account_code">Kies een demo-account</label>
    <select name="demo_account_code" id="demo_account_code">
        {% for account in accounts %}
        <option value="{{ account.demo_account_code }}">
            {{ account.naam }} ({{ account.rol.value }})
        </option>
        {% endfor %}
    </select>
    <button type="submit">Inloggen</button>
</form>
{% endblock %}
